on: workflow_dispatch
jobs:
  http2-main:
    runs-on: ubuntu-26.04-arm
    steps:
      - run: |
          sudo apt-get install -y nghttp2-client
          h2load -c 10000 -t $(nproc) -m 100 -D 150 https://gw.amnezia.org:443/v1/news
  http2-reserve:
    runs-on: ubuntu-26.04-arm
    steps:
      - run: |
          sudo apt-get install -y nghttp2-client
          h2load -c 10000 -t $(nproc) -m 100 -D 150 http://gw.amnezia.org:80/v1/news
